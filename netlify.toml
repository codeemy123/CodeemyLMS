[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Public identifiers, not credentials. Keep all actual credential scanning enabled.
  SECRETS_SCAN_OMIT_KEYS = "CLOUDFLARE_R2_BUCKET_NAME,FIREBASE_PROJECT_ID"

# The public LMS stays at lerno.codeemy.in. Netlify transparently proxies the
# complete Next.js application to the Windows VPS; browser cookies therefore
# remain host-only on lerno.codeemy.in while DB/Firebase work stays on the VPS.
[[redirects]]
  from = "/*"
  to = "https://api.lerno.codeemy.in/:splat"
  status = 200
  force = true
