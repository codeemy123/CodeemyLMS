
name: CodeEmy LMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve required install scripts
        run: npm install --ignore-scripts=false approve @prisma/engines prisma @firebase/util protobufjs

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lerno.codeemy.in

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare production release
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e

          output=$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\LMS\Backend\Deployments\scripts\prepare-release.ps1"' 2>&1)

          echo "$output"

          release_id=$(echo "$output" | sed -n 's/^Release ID: //p' | tail -n 1)

          if [[ ! "$release_id" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            echo "Could not identify the release ID."
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Deploy production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'C:\LMS\Backend\Deployments\scripts\deploy.ps1' -ReleaseId '$RELEASE_ID'"

      - name: Ensure latest code and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
              Write-Host \"=== Checking Active Directory for LMSBackend ===\"
              \$activeDir = (nssm get LMSBackend AppDirectory).Trim()
              Write-Host \"NSSM Active Dir: \$activeDir\"

              \$dirs = @(\"C:\LMS\Backend\CodeemyLMS-main\")
              if (\$activeDir -and (\$dirs -notcontains \$activeDir)) {
                \$dirs += \$activeDir
              }

              foreach (\$dir in \$dirs) {
                if (Test-Path \$dir) {
                  Write-Host \"=== Updating directory: \$dir ===\"
                  cd \$dir
                  if (Test-Path \"\$dir\.git\") {
                    git fetch origin main
                    git reset --hard origin/main
                  }
                  \$envFile = Join-Path \$dir \".env.local\"
                  if (Test-Path \$envFile) {
                    \$envContent = Get-Content \$envFile -Raw
                    if (-not (\$envContent -match \"LMS_PUBLIC_ORIGINS\")) {
                      Add-Content -Path \$envFile -Value \"`nLMS_PUBLIC_ORIGINS=https://lerno.codeemy.in,https://learnoin.netlify.app,https://api.lerno.codeemy.in`nLMS_DATABASE_MODE=true`n\"
                    }
                  }
                  npx prisma generate
                  npm run build
                }
              }

              Write-Host \"=== Restarting LMSBackend Service ===\"
              nssm restart LMSBackend
              Start-Sleep -Seconds 5
              nssm status LMSBackend
            "'
