
name: CodeEmy LMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve required install scripts
        run: npm install --ignore-scripts=false approve @prisma/engines prisma @firebase/util protobufjs

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lerno.codeemy.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare production release
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e

          output=$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\LMS\Backend\Deployments\scripts\prepare-release.ps1"' 2>&1)

          echo "$output"

          release_id=$(echo "$output" | sed -n 's/^Release ID: //p' | tail -n 1)

          if [[ ! "$release_id" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            echo "Could not identify the release ID."
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Back up, verify restore, and migrate before deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RUNTIME_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$RUNTIME_DATABASE_URL" || -z "$MIGRATION_DATABASE_URL" ]]; then
            echo "Required production secrets DATABASE_URL and MIGRATION_DATABASE_URL are missing; deployment is blocked."
            exit 1
          fi

          payload=$(python3 -c 'import base64,json,os; print(base64.b64encode(json.dumps({"runtimeUrl":os.environ["RUNTIME_DATABASE_URL"],"migrationUrl":os.environ["MIGRATION_DATABASE_URL"]}).encode()).decode())')
          {
            printf 'try {\n'
            printf '$__dbConfig = ConvertFrom-Json ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("%s")))\n' "$payload"
            printf '$env:DATABASE_URL = $__dbConfig.runtimeUrl\n$env:MIGRATION_DATABASE_URL = $__dbConfig.migrationUrl\n'
            cat scripts/predeploy-db.ps1
            printf '\n} catch { Write-Error $_; exit 1 }\n'
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command -"

      - name: Deploy production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\LMS\Backend\Deployments\scripts\deploy.ps1 -ReleaseId $RELEASE_ID"

      - name: Sync latest code, build, and restart LMSBackend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command -" < scripts/sync-vps.ps1

