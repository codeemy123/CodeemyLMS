
name: CodeEmy CD Connection Test

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: windows-latest

    steps:
      - name: Test SSH connection to production server
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\deploy_key"
          $sshDirectory = "$env:USERPROFILE\.ssh"
          $knownHostsPath = "$sshDirectory\known_hosts"

          # Create SSH directory
          New-Item -ItemType Directory -Path $sshDirectory -Force | Out-Null

          # Save private key
          $env:DEPLOY_SSH_KEY | Set-Content -Path $keyPath

          # Restrict private key permissions
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

          # Add server host key to known_hosts
          ssh-keyscan -p $env:DEPLOY_PORT $env:DEPLOY_HOST |
            Out-File -FilePath $knownHostsPath -Append

          # Test SSH connection
          ssh -i $keyPath `
            -p $env:DEPLOY_PORT `
            -o StrictHostKeyChecking=yes `
            -o BatchMode=yes `
            "$env:DEPLOY_USER@$env:DEPLOY_HOST" `
            "hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "SSH connection test failed."
          }

          # Remove temporary private key
          Remove-Item $keyPath -Force
